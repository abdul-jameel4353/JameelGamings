<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JameelGamings - Portal de Jogos Multiplataforma</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9fafb;color:#111827;font:14px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:2;background:#ffffffed;border-bottom:1px solid #e5e7eb;backdrop-filter:blur(12px)}.bar{max-width:1280px;height:64px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:850}.brand b{color:#059669}.brand small{display:block;font-size:9px;color:#9ca3af;letter-spacing:1px}nav{display:flex;gap:24px;font-weight:650}nav a:hover,.see{color:#059669}main{max-width:1280px;margin:auto;padding:32px 20px 70px}.hero{background:linear-gradient(110deg,#064e3b,#10b981);color:white;border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:270px}.hero img{width:190px;height:190px;object-fit:cover;border-radius:18px;box-shadow:0 10px 30px #064e3b80}.hero h1{font-size:36px;margin:14px 0}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.5px;font-weight:800}.btn{display:inline-block;padding:13px 20px;background:#10b981;color:white;border-radius:13px;font-weight:750;border:0;cursor:pointer}.hero .btn{background:#fff;color:#047857}.section{margin-top:38px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.heading h2{margin:0;font-size:21px}.chips{display:flex;gap:9px;overflow:auto;padding-bottom:5px}.chip{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:10px 15px;white-space:nowrap;font-weight:600;cursor:pointer}.chip.active,.chip:hover{background:#10b981;color:white;border-color:#10b981}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #f1f2f3;border-radius:16px;padding:12px;box-shadow:0 1px 3px #0000000b;transition:.2s}.card:hover{border-color:#10b981;transform:translateY(-2px)}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#e5e7eb}.card h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 5px}.muted{color:#6b7280}.card p{font-size:12px;margin:0}.badge{font-size:11px;background:#ecfdf5;color:#059669;border-radius:99px;padding:6px 11px;display:inline-block;margin-right:5px}.detail{background:white;border:1px solid #e5e7eb;border-radius:24px;padding:32px}.detail-head{display:flex;gap:24px;align-items:center;border-bottom:1px solid #eee;padding-bottom:24px}.detail-head img{width:110px;height:110px;object-fit:cover;border-radius:18px}.detail-head h1{margin:12px 0}.details-buttons{margin-left:auto;display:grid;gap:10px}.details-buttons a:nth-child(2){background:#2563eb}.description{white-space:pre-line;line-height:1.7;color:#374151}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.shots img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;cursor:pointer}input{font:inherit;border:1px solid #d1d5db;border-radius:12px;padding:13px 16px;width:100%;max-width:440px;outline-color:#10b981}.back{display:inline-block;margin-bottom:20px;font-weight:700}.more{margin-top:24px}footer{background:#111827;color:#d1d5db;padding:45px 20px}footer div{max-width:1280px;margin:auto}footer strong{font-size:20px;color:#fff}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.bar{padding:0 14px}nav{gap:12px;font-size:12px}.brand{font-size:17px}.hero{padding:24px;min-height:200px}.hero h1{font-size:25px}.hero img{width:100px;height:100px}.detail{padding:20px}.detail-head{flex-wrap:wrap}.details-buttons{margin-left:0;width:100%}.shots{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="bar"><a href="#/" class="brand">🎮 Jameel<b>Gamings</b><small>MULTIPLATFORM GAMES</small></a><nav><a href="#/">Início</a><a href="#/explorar">Explorar</a><a href="#/pesquisa">Pesquisa</a></nav></div></header><main id="app">A carregar jogos...</main><footer><div><strong>JameelGamings</strong><p>O seu portal de jogos multiplataforma.</p><a href="#/explorar">Explorar jogos</a></div></footer><script>
let games=[];const app=document.querySelector('#app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const image=u=>'/media'+u;const gameUrl=g=>'#/jogo/'+g.id;const categories=['Todos',...new Set(games.map(g=>g.category))];function card(g){return `<a class="card" href="${gameUrl(g)}"><img loading="lazy" src="${image(g.image)}" alt="${esc(g.title)}"><h3>${esc(g.title)}</h3><p class="muted">${esc(g.category)}</p><p class="badge">${esc(g.platforms.join(', '))}</p></a>`}function grid(arr){return `<div class="grid">${arr.map(card).join('')}</div>`}function chips(){return `<div class="chips">${['Todos',...new Set(games.map(g=>g.category))].map(c=>`<a class="chip" href="#/explorar/${encodeURIComponent(c)}">${esc(c)}</a>`).join('')}</div>`}function home(){let latest=games.find(g=>g.title==='Pro Evolution Soccer 2018')||games[0];app.innerHTML=`<div class="hero"><div><div class="eyebrow">Lançamento Mais Recente</div><h1>${esc(latest.title)}</h1><p>${esc(latest.platforms.join(', '))}</p><a class="btn" href="${gameUrl(latest)}">Ver Opções de Descarga →</a></div><img src="${image(latest.image)}" alt="${esc(latest.title)}"></div><section class="section"><div class="heading"><h2>Categorias Populares</h2><a class="see" href="#/explorar">Ver todas →</a></div>${chips()}</section><section class="section"><div class="heading"><h2>Jogos Recomendados para Si</h2></div>${grid(games.slice(0,6))}</section><section class="section"><div class="heading"><h2>Recentemente Publicados</h2><a class="see" href="#/explorar">Ver todos →</a></div>${grid([...games].reverse().slice(0,6))}</section><section class="section"><div class="heading"><h2>Jogos Mais Classificados</h2></div>${grid(games.slice(0,6))}</section>`}function explore(category='Todos',search=''){let list=games.filter(g=>(category==='Todos'||g.category===category)&&g.title.toLowerCase().includes(search.toLowerCase()));app.innerHTML=`<div class="heading"><div><h2>Explorar Jogos</h2><p class="muted">Descubra jogos para todas as plataformas</p></div></div><input id="search" placeholder="Pesquisar jogos..." value="${esc(search)}"><section class="section">${chips()}</section><section class="section"><p class="muted">${list.length} jogos encontrados</p>${grid(list)}</section>`;document.querySelector('#search').oninput=e=>{let pos=e.target.selectionStart;explore(category,e.target.value);let el=document.querySelector('#search');el.focus();el.setSelectionRange(pos,pos)}}function detail(id){let g=games.find(x=>x.id===id);if(!g){app.innerHTML='<h2>Jogo não encontrado</h2><a href="#/explorar">Explorar jogos</a>';return}app.innerHTML=`<a class="back" href="#/explorar">← Voltar</a><article class="detail"><div class="detail-head"><img src="${image(g.image)}" alt="${esc(g.title)}"><div><span class="badge">${esc(g.category)}</span><span class="badge">${esc(g.platforms.join(', '))}</span><h1>${esc(g.title)}</h1></div><div class="details-buttons">${g.links.map(l=>`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(l.label)}</a>`).join('')}</div></div><section class="section"><div class="eyebrow muted">Sobre o Jogo</div><p class="description">${esc(g.description)}</p></section>${g.screenshots.length?`<section class="section"><div class="eyebrow muted">Capturas de Ecrã</div><br><div class="shots">${g.screenshots.map(u=>`<a href="${image(u)}" target="_blank"><img loading="lazy" src="${image(u)}" alt="Captura de ecrã de ${esc(g.title)}"></a>`).join('')}</div></section>`:''}</article><section class="section"><div class="heading"><h2>Jogos Semelhantes na mesma Categoria</h2></div>${grid(games.filter(x=>x.category===g.category&&x.id!==id).slice(0,6))}</section>`}function route(){let parts=location.hash.slice(2).split('/');if(parts[0]==='jogo')detail(parts[1]);else if(parts[0]==='explorar')explore(decodeURIComponent(parts[1]||'Todos'));else if(parts[0]==='pesquisa')explore();else home();window.scrollTo(0,0)}fetch('/data/games.json').then(r=>r.json()).then(x=>{games=x;route()}).catch(()=>app.textContent='Não foi possível carregar os jogos.');window.addEventListener('hashchange',route);
</script></body></html>
